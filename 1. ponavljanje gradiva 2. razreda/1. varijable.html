<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // const, let, var, function, for... su ključne riječi
        // const zato što ne mijenjamo sadržaj varijable
        // name: naziv varijable
        // = pridruživanje vrijednosti
        // 'Mario' je sadržaj varijable
        // '' ili "" navodnici je svejedno, stvar dogovora
        // Sintaksa - pravila za pisanje koda
        const name = 'Mario'
        // vrsta podatka je number (broj)
        // pri nazivu varijabli koristimo camel case naming convenciju
        const numberOfPcs = 13
        const receiptAmount = 20.5
        // vrsta podatka boolean
        // kada je sadržaj varijable true ili false, ta se varijabla
        //  naziva boolean
        const isRaining = false
        // polje (eng. array) je vrsta podatka u koju možemo spremati više vrijednosti
        // examPoints je polje brojeva
        const examPoints = [50, 32, 80]
        // polje u koje smo spremili vrstu podatka tekst
        const studentNames = ['Ljubo', 'Dora']
        // polje može biti prazno
        const emptyArray = []
        // objekti se koriste za spremanje više vrijednosti
        // unutar objekta vrijednosti se pišu kao par, svojstvo: vrijednost (eng. property:value)
        // npr color: 'Yellow'
        // objekt može imati 0,1 ili više svojstava
        const chair = {
            color: 'Yellow',
            material: 'Fabric',
            hasWheels: true,
            numberOfWheels: 4
        }
        // prazan objekat, tj. bez svojstava
        const emptyObject = {}
        // ako trebamo kobminirati varijable i text, koristimo ``
        console.log(`Char color is ${chair.color}, material is ${chair.material}`)
        // ako je obični tekst bez miješanja varijabli onda mogu ravni navodnici
        const textWithoutValues = 'This is text without values'
    </script>
</body>

</html>
